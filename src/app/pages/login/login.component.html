<div class="min-h-screen flex items-center justify-center px-4 bg-page">
  <div class="w-full max-w-sm">
    <!-- Brand Icon and Title -->
    <div class="flex items-center justify-center mb-6">
      <svg width="100%" height="auto" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg" style="max-width: 420px;">
        <rect width="700" height="180" fill="#0B0F14"/>

        <!-- Icon -->
        <g transform="translate(40, 24)">
          <path d="M60 8 L108 26 V64 C108 97 88 119 60 133 C32 119 12 97 12 64 V26 Z"
                fill="#151D26" stroke="#5B8CFF" stroke-width="4.5" stroke-linejoin="round"/>
          <circle cx="60" cy="8" r="3.2" fill="#5B8CFF"/>
          <circle cx="108" cy="26" r="3.2" fill="#5B8CFF"/>
          <circle cx="12" cy="26" r="3.2" fill="#5B8CFF"/>
          <path d="M22 74 L42 74 L50 50 L60 92 L68 62 L76 74 L98 74"
                fill="none" stroke="#E6EDF3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="76" cy="74" r="6.5" fill="#0B0F14" stroke="#22C55E" stroke-width="2.5"/>
          <circle cx="76" cy="74" r="2.4" fill="#22C55E"/>
        </g>

        <!-- Wordmark -->
        <text x="200" y="94" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.5">
          <tspan fill="#E6EDF3">Sentinel</tspan><tspan fill="#5B8CFF">Ops</tspan>
        </text>

        <!-- Tagline -->
        <text x="202" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B98A8">
          Kubernetes observability &amp; automated remediation
        </text>
      </svg>
    </div>

    <!-- Feature Pillars -->
    <!-- <div class="text-center mb-6 space-y-1">
      <div class="text-xs text-secondaryText font-medium">Kubernetes Observability</div>
      <div class="text-xs text-secondaryText font-medium">AI Incident Diagnosis</div>
      <div class="text-xs text-secondaryText font-medium">Automated Remediation</div>
    </div> -->

    <!-- Card -->
    <div class="rounded-lg border border-border bg-surface1 p-6 shadow-xl">
      <form class="space-y-4" (submit)="onSubmit()">
        <div>
          <label class="block text-xs font-medium text-secondaryText mb-1.5">Email</label>
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            required
            placeholder="test@sentinelops.io"
            class="w-full rounded-md border border-border bg-surface2 px-3 py-2 text-sm text-primaryText outline-none focus:border-brand transition-colors placeholder-mutedText"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-secondaryText mb-1.5">Password</label>
          <input
            [(ngModel)]="password"
            name="password"
            type="password"
            required
            placeholder="••••••••••••"
            class="w-full rounded-md border border-border bg-surface2 px-3 py-2 text-sm text-primaryText outline-none focus:border-brand transition-colors placeholder-mutedText"
          />
        </div>

        <div *ngIf="errorMsg()" class="rounded-md border border-critical/30 bg-critical/10 p-2.5 text-xs text-critical">
          {{ errorMsg() }}
        </div>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full rounded-md bg-brand py-2.5 text-sm font-semibold text-on-brand hover:bg-brand-hover transition-colors disabled:opacity-50 flex items-center justify-center gap-2"
        >
          <svg *ngIf="isLoading()" class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>{{ isLoading() ? 'Signing in...' : 'Sign in' }}</span>
        </button>
      </form>
    </div>

    <!-- Test credentials helper box -->
    <div class="text-center text-xs mt-6 text-mutedText space-y-1">
      <!-- <div>Secure access to your infrastructure</div>
      <div class="font-mono text-[11px] text-secondaryText">test&#64;sentinelops.io / motdepasse123</div> -->
    </div>
  </div>
</div>
